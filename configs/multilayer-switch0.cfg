! Multilayer Switch0 (Cisco Catalyst 3650-24PS) — core / distribution switch
! Hostname in CLI: SwitchL3
! Sources: docs/screenshots/4, 5, 6, 7, 8, 9, 13, 20, 21, 22-25

! ---------------------------------------------------------------
! SVIs — one per VLAN, each acting as the default-gateway ("SVI
! gateway") for its department/service subnet. All confirmed live
! via the CLI session in docs/screenshots/6-9.
! ---------------------------------------------------------------

interface vlan 20
 description Executive SVI gateway
 ip address 192.168.20.254 255.255.255.0
 no shutdown

interface vlan 21
 description Sales SVI gateway
 ip address 192.168.21.254 255.255.255.0
 no shutdown

interface vlan 22
 description HR SVI Gateway
 ip address 192.168.22.254 255.255.255.0
 no shutdown

interface vlan 23
 description Accounting SVI gateway
 ip address 192.168.23.254 255.255.255.0
 no shutdown

interface vlan 24
 description Operations SVI gateway
 ip address 192.168.24.254 255.255.255.0
 no shutdown

interface vlan 25
 description Marketing SVI gateway
 ip address 192.168.25.254 255.255.255.0
 no shutdown

! Note: VLAN 26 does not appear anywhere in the captured config —
! it's skipped between Marketing (25) and IT (27).

interface vlan 27
 description IT SVI Gateway
 ip address 192.168.27.254 255.255.255.0
 no shutdown

interface vlan 30
 description Servers SVI Gateway
 ip address 192.168.30.254 255.255.255.0
 no shutdown

interface vlan 40
 description Printing SVI Gateway
 ip address 192.168.40.254 255.255.255.0
 no shutdown

interface vlan 50
 description Telephony SVI Gateway
 ip address 192.168.50.254 255.255.255.0
 no shutdown

interface vlan 60
 description Wifi SVI Gateway
 ip address 192.168.60.254 255.255.255.0
 no shutdown

interface vlan 100
 description Administration SVI Gateway
 ip address 192.168.100.254 255.255.255.0
 no shutdown

! ipv6 address 2001:db8:acad:100::254/64   (per the original addressing
!  plan, docs/screenshots/13 — not yet applied/verified in a screenshot)

! ---------------------------------------------------------------
! Downlink trunks to the access-layer switches — confirmed via the
! CLI session in docs/screenshots/4 and 5.
! ---------------------------------------------------------------

interface GigabitEthernet1/0/2
 description Uplink to Exec-Sales
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 20,21,40,50
 ! NB: as typed, vlan 100 itself is native but not listed in the
 ! allowed set on this port — likely an oversight worth revisiting.

interface GigabitEthernet1/0/3
 description Uplink to HR-Acc
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 22,23,40,50,100

! GigabitEthernet1/0/4 — Uplink to Ops-Mktg. Not captured in a
! screenshot; the Ops-Mktg side (configs/ops-mktg.cfg) confirms
! vlans 24,25,40,100 are trunked, so the core side is presumed
! symmetric (native vlan 100, allowed 24,25,40,50,100) but unverified.

interface GigabitEthernet1/0/5
 description Uplink to IT
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 27,40,50,100

! ---------------------------------------------------------------
! Access ports for directly-attached core-zone devices — confirmed
! via docs/screenshots/5.
! ---------------------------------------------------------------

interface GigabitEthernet1/0/6
 description App-Server (or File-Server / AD-server)
 switchport mode access
 switchport access vlan 30

interface GigabitEthernet1/0/7
 description File-Server (or App-Server / AD-server)
 switchport mode access
 switchport access vlan 30

interface GigabitEthernet1/0/8
 description AD-server (or App-Server / File-Server)
 switchport mode access
 switchport access vlan 30

interface GigabitEthernet1/0/9
 description Access Point0 (Wifi)
 switchport mode access
 switchport access vlan 60
